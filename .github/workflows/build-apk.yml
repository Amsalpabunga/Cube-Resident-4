# Build CubeEvil4 Android APK (with custom Vulkan driver support)
#
# Triggers: push to main/master, tags, or manual dispatch.
# Output: APK uploaded as workflow artifact.
#
# Place this file at:
#   .github/workflows/build-apk.yml
# (repo root, or adjust the "working-directory" below if your
# android project lives elsewhere)

name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Product flavor (classic / core)'
        required: true
        default: 'classic'
        type: choice
        options: [classic, core]
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [debug, release]

env:
  # Matches app/build.gradle
  NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.22.1'
  # Path to the Android Gradle project inside the repo
  ANDROID_PROJECT: port/android-decomp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake + platform tools
        run: |
          sdkmanager --install \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"
          # Accept licenses (non-interactive)
          yes | sdkmanager --licenses || true

      - name: Decide flavor + build type
        id: cfg
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'classic' }}"
          TYPE="${{ github.event.inputs.build_type || 'release' }}"
          # Capitalize first letter for Gradle task name (Classic / Core)
          FLAVOR_CAP="$(echo "$FLAVOR" | sed 's/^./\U&/')"
          TYPE_CAP="$(echo "$TYPE" | sed 's/^./\U&/')"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "task=assemble${FLAVOR_CAP}${TYPE_CAP}" >> "$GITHUB_OUTPUT"
          echo "Building task: assemble${FLAVOR_CAP}${TYPE_CAP}"

      - name: Grant execute on gradlew
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        env:
          # Optional: bump version name from the tag
          ORG_GRADLE_PROJECT_re4.versionName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            ${{ steps.cfg.outputs.task }} \
            -Pre4.versionName="${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Locate APK
        id: apk
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          # Typical outputs:
          #   app/build/outputs/apk/classic/release/app-classic-release-unsigned.apk
          #   app/build/outputs/apk/classic/debug/app-classic-debug.apk
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "No APK found under app/build/outputs/apk"
            find app/build/outputs -type f || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-${{ steps.cfg.outputs.flavor }}-${{ steps.cfg.outputs.type }}-${{ github.sha }}
          path: ${{ env.ANDROID_PROJECT }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload native logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            ${{ env.ANDROID_PROJECT }}/app/build/outputs/
            ${{ env.ANDROID_PROJECT }}/app/.cxx/
          retention-days: 7
          if-no-files-found: ignore
          
